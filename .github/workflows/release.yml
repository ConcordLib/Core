name: CI & Release

# Build, test, pack, and release in one pipeline. The full game-dependent solution
# (Concord.slnx) is not buildable on hosted runners, so this exercises Concord.ci.slnx,
# which excludes the runtime adapters and TestMod (they reference game assemblies via
# a local GameDir).
#
# The file is named release.yml because nuget.org Trusted Publishing pins the OIDC policy
# to a workflow filename; the publish job must live in release.yml for the token to validate.
#
# The release job depends on the full test matrix (test), the mono leg (test-mono), and the
# SonarCloud scan (sonar), so a release cannot cut or publish unless every required test leg
# passes and the quality gate is green (the scan blocks on sonar.qualitygate.wait). It only runs
# on pushes to main (not PRs): semantic-release cuts the v* tag + GitHub Release, then the
# job packs Concord.Ref, Concord.Analyzers, Concord.Generators, and Concord.Runtime (versions
# stamped from the tag by MinVer) and publishes to nuget.org via Trusted Publishing (OIDC ->
# short-lived API key; no stored key). --skip-duplicate makes a re-run on the same commit idempotent.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Released Core tag to resend to a runtime repository (for example, v0.7.1)
        required: false
        type: string
      runtime_repository:
        description: Runtime repository to rebuild
        required: false
        default: RimWorld
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build & Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          # global.json (10.0.100, rollForward latestFeature) pins the exact SDK;
          # '10.0.x' here ensures the matching band is installed and available.

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Concord.ci.slnx

      - name: Build
        run: dotnet build Concord.ci.slnx -c Release --no-restore

      # Produce the compile-time-only Concord.Ref nupkg (ref/ folder, no lib/).
      - name: Pack reference assembly
        run: dotnet pack src/Concord.Ref/Concord.Ref.csproj -c Release -o artifacts

      # Concord.Harmony is a real (lib/) package, not merged into Concord.dll: it needs a
      # 0Harmony reference and Concord.Ref keeps its public metadata free of third-party types.
      - name: Pack Harmony host
        run: dotnet pack src/Concord.Harmony/Concord.Harmony.csproj -c Release -o artifacts

      - name: Upload runtime assembly
        uses: actions/upload-artifact@v4
        with:
          name: concord-runtime
          path: |
            Assemblies/net10.0/Concord.dll
            Assemblies/netstandard2.0/Concord.dll
          if-no-files-found: error

      - name: Upload ref package
        uses: actions/upload-artifact@v4
        with:
          name: concord-ref-nupkg
          path: artifacts/Concord.Ref.*.nupkg
          if-no-files-found: error

  # SonarCloud must analyse through the .NET scanner, not Automatic Analysis. Automatic
  # Analysis never runs MSBuild, so it cannot see <Nullable>enable</Nullable> from
  # Directory.Build.props and reported ~110 phantom S8970 "null-forgiving operator is
  # pointless" issues. The begin/build/end sandwich runs SonarAnalyzer as a Roslyn analyzer
  # inside the real compilation, so it reads the same properties the compiler does.
  # Automatic Analysis must stay off in project settings; with both enabled SonarCloud
  # rejects the CI report.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    # Secrets are withheld from fork PRs, so the scanner could never authenticate there;
    # skip rather than leave a permanently red required check on outside contributions.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # blame data for new-code detection; a shallow clone dates every line to the checkout

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The scanner is a Java application regardless of the language being analysed.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install scanner
        run: dotnet tool install --global dotnet-sonarscanner

      # No --no-incremental/--no-restore on the build below: the scanner only sees files that
      # actually compile in this step, so a build skipped as up-to-date yields an empty report.
      - name: Analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet sonarscanner begin \
            /k:"ConcordLib_Core" \
            /o:"concordlib" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.scanner.scanAll=false \
            /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="tests/**" \
            /d:sonar.qualitygate.wait=true
          dotnet build Concord.ci.slnx -c Release
          dotnet test Concord.ci.slnx -c Release --no-build -f net10.0 \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --results-directory coverage
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  test:
    name: Test · ${{ matrix.label }}
    needs: build
    runs-on: ${{ matrix.runner }}
    # fail-fast off so one flaky platform doesn't cancel the rest; experimental cells
    # (arm64 / x64-on-intel-mac) don't fail the overall run until promoted below.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Canonical trio — required (experimental: false).
          - { label: linux-x64,    runner: ubuntu-24.04,   experimental: false, testFilter: '' }
          - { label: windows-x64,  runner: windows-latest, experimental: false, testFilter: '' }
          - { label: macos-arm64,  runner: macos-latest,   experimental: false, testFilter: '' }
          # Extended coverage — informational until green, then flip experimental to false.
          # macos-x64 (macos-13, Intel) is dropped: GitHub is retiring Intel mac runners, so
          # it is slow/scarce to allocate and stalled every release without ever completing.
          # Apple Silicon macOS is still covered by the required macos-arm64 cell.
          - { label: linux-arm64,  runner: ubuntu-24.04-arm, experimental: true,  testFilter: '' }
          # Concord.Harmony.Tests is filtered out here because MonoMod has no win-arm64 support:
          # every test that installs a detour throws "The runtime's Abi field is not set, and is
          # unusable (MonoMod.Core.Platforms.Runtimes.Core100Runtime)". MonoMod#279 is still open,
          # and the "Add Windows-ARM64 support" commit (e8e742c) sits on a branch that has diverged
          # from master, so no released MonoMod.Core carries the fix and a version bump cannot help.
          # Everything else passes on this runner, so the cell is filtered rather than dropped:
          # it still guards the other ~700 tests on arm64. Remove the filter when MonoMod ships it.
          # Still experimental for one run: the net472 leg below has only ever been skipped here
          # (the net10.0 Test step failed first), so it is unproven on arm64. Promote once green.
          - { label: windows-arm64,runner: windows-11-arm,   experimental: true,  testFilter: 'FullyQualifiedName!~Concord.Harmony.Tests' }
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Concord.ci.slnx

      - name: Test
        run: dotnet test Concord.ci.slnx -c Release --no-restore -f net10.0 --logger trx --results-directory test-results ${{ matrix.testFilter != '' && format('--filter "{0}"', matrix.testFilter) || '' }}

      - name: Test (net472)
        if: startsWith(matrix.runner, 'windows')
        run: |
          dotnet test tests/Concord.Detour.Tests/Concord.Detour.Tests.csproj -c Release --no-restore -f net472
          dotnet test tests/Concord.Emit.Tests/Concord.Emit.Tests.csproj -c Release --no-restore -f net472
          dotnet test tests/Concord.AttachedData.Tests/Concord.AttachedData.Tests.csproj -c Release --no-restore -f net472
          dotnet test tests/Concord.Orchestration.Tests/Concord.Orchestration.Tests.csproj -c Release --no-restore -f net472

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.label }}
          path: test-results/**/*.trx

  test-mono:
    name: Test · mono (net472)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install mono
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Concord.ci.slnx

      - name: Build net472 test assemblies
        run: dotnet build Concord.ci.slnx -c Release --no-restore

      - name: Run suites under mono
        run: |
          set -e
          # Pick the newest cached runner. A stale older xunit.runner.console (e.g. 2.9.2)
          # left in the cache would make mono fail to load the tests' xunit.assert 2.9.3 with
          # a FileNotFoundException; sort -V | tail -1 selects the version the restore pulled.
          RUNNER=$(find ~/.nuget/packages/xunit.runner.console -name xunit.console.exe -path '*net472*' | sort -V | tail -1)
          for dll in Detour Emit AttachedData Orchestration; do
            mono "$RUNNER" "tests/Concord.$dll.Tests/bin/Release/net472/Concord.$dll.Tests.dll"
          done

  release:
    name: Release & Publish
    needs: [test, test-mono, sonar]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Hoisted to env because the secrets context is not valid in step-level `if`.
      RUNTIME_DISPATCH_REPOS: ${{ secrets.RUNTIME_DISPATCH_REPOS }}
    permissions:
      contents: write        # semantic-release: push tag, create GitHub Release
      issues: write          # semantic-release: comment on resolved issues
      pull-requests: write   # semantic-release: comment on merged PRs
      id-token: write        # Trusted Publishing: GitHub OIDC token for NuGet login
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # semantic-release walks commit history; MinVer reads tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # A build for packing only; the test/test-mono jobs already gated correctness.
      - name: Build
        run: dotnet build Concord.ci.slnx -c Release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # conventionalcommits preset: the angular default ignores the `!`
        # breaking-change shorthand; the preset package must be installed alongside.
        run: npx -y -p semantic-release@24 -p conventional-changelog-conventionalcommits@9 semantic-release

      # semantic-release tags HEAD when it cuts a release; no tag means nothing to publish.
      - name: Detect release tag
        id: tag
        run: |
          TAG=$(git tag --points-at HEAD | grep '^v' | head -1 || true)
          if [ -n "$TAG" ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Publishing $TAG"
          else
            echo "No release tag on HEAD; skipping publish."
          fi

      - name: Pack
        if: steps.tag.outputs.tag != ''
        run: |
          dotnet pack src/Concord.Ref/Concord.Ref.csproj -c Release -o artifacts
          dotnet pack src/Concord.Analyzers/Concord.Analyzers.csproj -c Release -o artifacts
          dotnet pack src/Concord.Generators/Concord.Generators.csproj -c Release -o artifacts
          dotnet pack src/Concord.Harmony/Concord.Harmony.csproj -c Release -o artifacts
          dotnet pack src/Concord/Concord.csproj -c Release -o artifacts

      - name: NuGet login
        if: steps.tag.outputs.tag != ''
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        if: steps.tag.outputs.tag != ''
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Announce on Discord
        if: steps.tag.outputs.tag != ''
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.NEO_MODS_DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES=$(gh release view "${{ steps.tag.outputs.tag }}" --json body -q .body | head -c 1600)
          URL=$(gh release view "${{ steps.tag.outputs.tag }}" --json url -q .url)
          CONTENT=$(printf '**Concord %s** — now on NuGet\n\n%s\n\n%s' "${{ steps.tag.outputs.tag }}" "$NOTES" "$URL")
          STATUS=$(curl -sS -o response.txt -w '%{http_code}' -X POST "${WEBHOOK}?thread_id=1522736349583638711&wait=true" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$CONTENT" '{content:$c, allowed_mentions:{parse:[]}}')")
          echo "Discord HTTP $STATUS"
          cat response.txt
          if [ "$STATUS" -ge 400 ]; then
            echo "::warning::Discord announce failed with HTTP $STATUS (release itself is unaffected)"
          fi

      # Runtime repositories bundle Core's Concord.dll, so a new Core release must rebuild
      # and re-release them. GITHUB_TOKEN cannot trigger workflows in another repo, so mint
      # a short-lived token from a GitHub App installed on the runtime repos. The repo list
      # lives in the RUNTIME_DISPATCH_REPOS secret; when it is absent these steps no-op.
      # Masking runs first because secret auto-masking covers only the whole comma-joined
      # value, not the individual names an error message might echo.
      - name: Mask runtime repository names
        if: steps.tag.outputs.tag != '' && env.RUNTIME_DISPATCH_REPOS != ''
        run: |
          set -euo pipefail
          IFS=',' read -ra repos <<< "$RUNTIME_DISPATCH_REPOS"
          for repo in "${repos[@]}"; do
            echo "::add-mask::$(echo "$repo" | xargs)"
          done

      - name: Generate runtime dispatch token
        if: steps.tag.outputs.tag != '' && env.RUNTIME_DISPATCH_REPOS != ''
        id: apptoken
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RUNTIME_DISPATCH_APP_ID }}
          private-key: ${{ secrets.RUNTIME_DISPATCH_APP_PRIVATE_KEY }}
          owner: ConcordLib
          repositories: ${{ env.RUNTIME_DISPATCH_REPOS }}

      - name: Trigger runtime rebuilds
        if: steps.tag.outputs.tag != '' && env.RUNTIME_DISPATCH_REPOS != ''
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          IFS=',' read -ra repos <<< "$RUNTIME_DISPATCH_REPOS"
          for repo in "${repos[@]}"; do
            repo=$(echo "$repo" | xargs)
            gh api "repos/ConcordLib/$repo/dispatches" \
              -f event_type=core-released \
              -F "client_payload[core_version]=${{ steps.tag.outputs.tag }}"
          done

  # Retry path for a runtime dispatch that was skipped or failed after Core was already
  # published. Supplying no runtime_version preserves the existing build-only manual run.
  dispatch-runtime:
    name: Dispatch runtime rebuild
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate runtime-repository token
        id: apptoken
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RUNTIME_DISPATCH_APP_ID }}
          private-key: ${{ secrets.RUNTIME_DISPATCH_APP_PRIVATE_KEY }}
          owner: ConcordLib
          repositories: ${{ inputs.runtime_repository }}

      - name: Trigger runtime rebuild
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          RUNTIME_REPOSITORY: ${{ inputs.runtime_repository }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          set -euo pipefail
          echo "::add-mask::${RUNTIME_REPOSITORY}"
          gh api "repos/ConcordLib/${RUNTIME_REPOSITORY}/dispatches" \
            -f event_type=core-released \
            -F "client_payload[core_version]=${RUNTIME_VERSION}"
