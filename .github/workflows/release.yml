name: CI & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Released Core tag to resend to a runtime repository (for example, v0.7.1)
        required: false
        type: string
      runtime_repository:
        description: Runtime repository to rebuild
        required: false
        default: RimWorld
        type: string

permissions:
  contents: read

jobs:
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'workflow_dispatch' || inputs.runtime_version == '')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache NuGet
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache SonarCloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install scanner
        run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0

      - name: Analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet sonarscanner begin \
            /k:"ConcordLib_Core" \
            /o:"concordlib" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.scanner.scanAll=false \
            /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="tests/**,bench/**" \
            /d:sonar.qualitygate.wait=true
          dotnet build Concord.ci.slnx -c Release
          dotnet test Concord.ci.slnx -c Release --no-build -f net10.0 \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --results-directory coverage
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  test:
    name: Test · ${{ matrix.label }}
    if: github.event_name != 'workflow_dispatch' || inputs.runtime_version == ''
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64,    runner: ubuntu-24.04,   experimental: false, testFilter: '' }
          - { label: windows-x64,  runner: windows-latest, experimental: false, testFilter: '' }
          - { label: macos-arm64,  runner: macos-latest,   experimental: false, testFilter: '' }
          # TODO(arm64): flip experimental to false once this cell is green
          - { label: linux-arm64,  runner: ubuntu-24.04-arm, experimental: true,  testFilter: '' }
          # TODO(MonoMod#279): drop the testFilter when MonoMod.Core ships win-arm64
          - { label: windows-arm64,runner: windows-11-arm,   experimental: false, testFilter: 'FullyQualifiedName!~Concord.Harmony.Tests' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Concord.ci.slnx

      - name: Test
        run: dotnet test Concord.ci.slnx -c Release --no-restore -f net10.0 --logger trx --results-directory test-results ${{ matrix.testFilter != '' && format('--filter "{0}"', matrix.testFilter) || '' }}

      - name: Test (net472)
        if: startsWith(matrix.runner, 'windows')
        shell: pwsh
        run: |
          $failed = @()
          $suites = @(
            'tests/Concord.Detour.Tests/Concord.Detour.Tests.csproj',
            'tests/Concord.Emit.Tests/Concord.Emit.Tests.csproj',
            'tests/Concord.AttachedData.Tests/Concord.AttachedData.Tests.csproj',
            'tests/Concord.Orchestration.Tests/Concord.Orchestration.Tests.csproj'
          )
          foreach ($suite in $suites) {
            dotnet test $suite -c Release --no-restore -f net472
            if ($LASTEXITCODE -ne 0) { $failed += $suite }
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::net472 suites failed: $($failed -join ', ')"
            exit 1
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.label }}
          path: test-results/**/*.trx

  test-mono:
    name: Test · mono (net472)
    if: github.event_name != 'workflow_dispatch' || inputs.runtime_version == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Install mono
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete

      - name: Cache NuGet
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Concord.ci.slnx

      - name: Build net472 test assemblies
        run: |
          dotnet build Concord.ci.slnx -c Release --no-restore

      - name: Run suites under mono
        run: |
          set -e
          RUNNER=$(find ~/.nuget/packages/xunit.runner.console -name xunit.console.exe -path '*net472*' | sort -V | tail -1)
          for dll in Detour Emit AttachedData Orchestration Harmony; do
            mono "$RUNNER" "tests/Concord.$dll.Tests/bin/Release/net472/Concord.$dll.Tests.dll"
          done

  release:
    name: Release & Publish
    needs: [test, test-mono, sonar]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RUNTIME_DISPATCH_REPOS: ${{ secrets.RUNTIME_DISPATCH_REPOS }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build Concord.ci.slnx -c Release

      - name: Smoke pack
        run: |
          set -euo pipefail
          dotnet pack src/Concord.Ref/Concord.Ref.csproj -c Release -o "$RUNNER_TEMP/pack-smoke"
          dotnet pack src/Concord.Analyzers/Concord.Analyzers.csproj -c Release -o "$RUNNER_TEMP/pack-smoke"
          dotnet pack src/Concord.Generators/Concord.Generators.csproj -c Release -o "$RUNNER_TEMP/pack-smoke"
          dotnet pack src/Concord.Harmony/Concord.Harmony.csproj -c Release -o "$RUNNER_TEMP/pack-smoke"
          dotnet pack src/Concord/Concord.csproj -c Release -o "$RUNNER_TEMP/pack-smoke"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Snapshot tags on HEAD
        env:
          LC_ALL: C
        run: git tag --points-at HEAD | sort > "$RUNNER_TEMP/tags-before"

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx -y -p semantic-release@24.2.9 -p conventional-changelog-conventionalcommits@9.3.1 semantic-release

      - name: Detect release tag
        id: tag
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          git tag --points-at HEAD | sort > "$RUNNER_TEMP/tags-after"
          TAG=$(grep '^v' "$RUNNER_TEMP/tags-after" | sort -V | tail -1 || true)
          RELEASED=$(comm -13 "$RUNNER_TEMP/tags-before" "$RUNNER_TEMP/tags-after" | grep '^v' | sort -V | tail -1 || true)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "released=$RELEASED" >> "$GITHUB_OUTPUT"
          echo "newest v-tag on HEAD: ${TAG:-none}"
          echo "cut by this run: ${RELEASED:-none}"

      - name: Pack
        if: steps.tag.outputs.tag != ''
        run: |
          dotnet pack src/Concord.Ref/Concord.Ref.csproj -c Release -o artifacts
          dotnet pack src/Concord.Analyzers/Concord.Analyzers.csproj -c Release -o artifacts
          dotnet pack src/Concord.Generators/Concord.Generators.csproj -c Release -o artifacts
          dotnet pack src/Concord.Harmony/Concord.Harmony.csproj -c Release -o artifacts
          dotnet pack src/Concord/Concord.csproj -c Release -o artifacts

      - name: NuGet login
        if: steps.tag.outputs.tag != ''
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        if: steps.tag.outputs.tag != ''
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Announce on Discord
        if: steps.tag.outputs.released != ''
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.NEO_MODS_DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES=$(gh release view "${{ steps.tag.outputs.released }}" --json body -q .body | head -c 1600)
          URL=$(gh release view "${{ steps.tag.outputs.released }}" --json url -q .url)
          CONTENT=$(printf '**Concord %s** — now on NuGet\n\n%s\n\n%s' "${{ steps.tag.outputs.released }}" "$NOTES" "$URL")
          STATUS=$(curl -sS -o response.txt -w '%{http_code}' -X POST "${WEBHOOK}?thread_id=1522736349583638711&wait=true" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$CONTENT" '{content:$c, allowed_mentions:{parse:[]}}')")
          echo "Discord HTTP $STATUS"
          cat response.txt
          if [ "$STATUS" -ge 400 ]; then
            echo "::warning::Discord announce failed with HTTP $STATUS (release itself is unaffected)"
          fi

      - name: Mask runtime repository names
        if: steps.tag.outputs.tag != '' && env.RUNTIME_DISPATCH_REPOS != ''
        run: |
          set -euo pipefail
          IFS=',' read -ra repos <<< "$RUNTIME_DISPATCH_REPOS"
          for repo in "${repos[@]}"; do
            echo "::add-mask::$(echo "$repo" | xargs)"
          done

      - name: Generate runtime dispatch token
        if: steps.tag.outputs.released != '' && env.RUNTIME_DISPATCH_REPOS != ''
        id: apptoken
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.RUNTIME_DISPATCH_APP_ID }}
          private-key: ${{ secrets.RUNTIME_DISPATCH_APP_PRIVATE_KEY }}
          owner: ConcordLib
          repositories: ${{ env.RUNTIME_DISPATCH_REPOS }}

      - name: Trigger runtime rebuilds
        if: steps.tag.outputs.released != '' && env.RUNTIME_DISPATCH_REPOS != ''
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          IFS=',' read -ra repos <<< "$RUNTIME_DISPATCH_REPOS"
          for repo in "${repos[@]}"; do
            repo=$(echo "$repo" | xargs)
            gh api "repos/ConcordLib/$repo/dispatches" \
              -f event_type=core-released \
              -F "client_payload[core_version]=${{ steps.tag.outputs.released }}"
          done

  dispatch-runtime:
    name: Dispatch runtime rebuild
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mask runtime repository name
        env:
          RUNTIME_REPOSITORY: ${{ inputs.runtime_repository }}
        run: echo "::add-mask::${RUNTIME_REPOSITORY}"

      - name: Generate runtime-repository token
        id: apptoken
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.RUNTIME_DISPATCH_APP_ID }}
          private-key: ${{ secrets.RUNTIME_DISPATCH_APP_PRIVATE_KEY }}
          owner: ConcordLib
          repositories: ${{ inputs.runtime_repository }}

      - name: Trigger runtime rebuild
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          RUNTIME_REPOSITORY: ${{ inputs.runtime_repository }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          set -euo pipefail
          gh api "repos/ConcordLib/${RUNTIME_REPOSITORY}/dispatches" \
            -f event_type=core-released \
            -F "client_payload[core_version]=${RUNTIME_VERSION}"
